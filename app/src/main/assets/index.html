<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DPAdmin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f0f11;
            --card-bg: #18181b;
            --text: #ffffff;
            --text-muted: #888888;
            --accent: #8b5cf6;
            --accent-blue: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; font-size: 20px; font-weight: bold; }
        .logo i { color: var(--accent); margin-right: 10px; font-size: 24px; }
        .header-actions { display: flex; gap: 10px; }
        .badge-live { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .badge-live::before { content: ''; width: 6px; height: 6px; background: var(--success); border-radius: 50%; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .icon-btn.logout { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

        /* SEARCH & FILTERS */
        .search-section { padding: 20px; display: flex; gap: 15px; align-items: center; }
        .search-box { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; display: flex; align-items: center; gap: 10px; }
        .search-box input { background: transparent; border: none; color: var(--text); width: 100%; outline: none; font-size: 15px; }
        .search-box i { color: var(--text-muted); }
        .add-btn { background: linear-gradient(135deg, #a855f7, #3b82f6); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }

        .filters { display: flex; gap: 10px; padding: 0 20px 20px 20px; overflow-x: auto; }
        .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--card-bg); color: var(--text); border-color: var(--text-muted); }

        /* CARDS */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; margin: 0 20px 15px 20px; padding: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; }
        .card-title i { color: var(--accent-blue); }
        .copy-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .status-active { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }

        .card-info { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .info-row { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; font-weight: 500; }
        .info-row.muted { color: var(--text-muted); font-size: 13px; font-weight: normal; }
        .info-row i { width: 16px; text-align: center; }

        .hwid-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .hwid-tag { background: #111115; border: 1px solid var(--border); color: var(--accent-blue); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-family: monospace; display: flex; align-items: center; gap: 5px; }

        .card-actions { display: flex; gap: 10px; border-top: 1px solid var(--border); padding-top: 15px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; border: 1px solid transparent; }
        .btn-edit { background: rgba(255, 255, 255, 0.05); color: var(--text); border-color: var(--border); }
        .btn-ban { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #111113; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 12px; gap: 5px; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-fingerprint"></i> DPAdmin</div>
        <div class="header-actions">
            <div class="badge-live">LIVE</div>
            <button class="icon-btn"><i class="fas fa-sync-alt"></i></button>
            <button class="icon-btn logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by Key or Username...">
        </div>
        <button class="add-btn" onclick="addKey()"><i class="fas fa-plus"></i></button>
    </div>

    <div class="filters">
        <button class="filter-btn active">ALL</button>
        <button class="filter-btn">ACTIVE</button>
        <button class="filter-btn">EXPIRED</button>
        <button class="filter-btn">BANNED</button>
    </div>

    <div id="keysContainer">
        <!-- Cards ilalabas dito ng JavaScript -->
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-key"></i> Keys</div>
        <div class="nav-item"><i class="fas fa-cog"></i> Settings</div>
    </div>

    <script>
        let keys = [
            {
                id: 1,
                key: "11:11",
                status: "ACTIVE",
                user: "NEED TO CHANGE NEW PANEL",
                date: "2026-10-23",
                deviceCount: "11 / 11",
                hwids: ["134f21fc", "285b5102", "2d8e1727", "4c1389fa", "5e009da0", "735bfaf3", "789409bf", "84d2b312", "a102d893", "a2174a9b", "fb6e39c5"]
            },
            {
                id: 2,
                key: "12:12",
                status: "ACTIVE",
                user: "FEEDBACK OR ELSE!!",
                date: "2026-10-25",
                deviceCount: "2 / 12",
                hwids: ["1600d192", "b44209ce"]
            }
        ];

        function renderKeys() {
            const container = document.getElementById('keysContainer');
            container.innerHTML = '';

            keys.forEach(k => {
                const hwidTags = k.hwids.map(h => `<div class="hwid-tag"><i class="fas fa-microchip"></i> ${h}</div>`).join('');

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">
                            <i class="fas fa-fingerprint"></i> ${k.key}
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${k.key}')"><i class="far fa-copy"></i></button>
                        </div>
                        <div class="status-badge status-active">${k.status}</div>
                    </div>
                    <div class="card-info">
                        <div class="info-row"><i class="fas fa-user"></i> ${k.user}</div>
                        <div class="info-row muted">
                            <i class="far fa-calendar-alt"></i> ${k.date} &nbsp;&nbsp; 
                            <i class="fas fa-mobile-alt"></i> ${k.deviceCount}
                        </div>
                    </div>
                    <div class="hwid-grid">${hwidTags}</div>
                    <div class="card-actions">
                        <button class="action-btn btn-edit"><i class="fas fa-pen"></i> Edit</button>
                        <button class="action-btn btn-ban"><i class="fas fa-ban"></i> Ban</button>
                        <button class="action-btn btn-delete" onclick="deleteKey(${k.id})"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addKey() {
            let newKey = prompt("Enter New Key (e.g. 15:15):");
            if(newKey) {
                keys.push({
                    id: Date.now(),
                    key: newKey,
                    status: "ACTIVE",
                    user: "NEW USER",
                    date: "2026-12-31",
                    deviceCount: "0 / 5",
                    hwids: []
                });
                renderKeys();
            }
        }

        function deleteKey(id) {
            if(confirm("Are you sure you want to delete this key?")) {
                keys = keys.filter(k => k.id !== id);
                renderKeys();
            }
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none';
            });
        });

        renderKeys();
    </script>
</body>
</html>
